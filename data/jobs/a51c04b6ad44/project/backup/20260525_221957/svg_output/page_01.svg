<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- 主渐变背景 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B3D"/>
      <stop offset="40%" stop-color="#1A2D5C"/>
      <stop offset="100%" stop-color="#2D4A7A"/>
    </linearGradient>
    <!-- 装饰渐变 -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#48CAE4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#48CAE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- 装饰性几何元素 - 右上角 -->
  <circle cx="1100" cy="80" r="180" fill="#48CAE4" opacity="0.04"/>
  <circle cx="1180" cy="20" r="120" fill="#00B4D8" opacity="0.06"/>
  
  <!-- 装饰性几何元素 - 左下角 -->
  <circle cx="-80" cy="650" r="250" fill="#0077B6" opacity="0.05"/>
  <circle cx="200" cy="780" r="200" fill="#48CAE4" opacity="0.03"/>

  <!-- 顶部细装饰线 -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentGrad)"/>

  <!-- 左侧竖排装饰条 -->
  <rect x="0" y="0" width="6" height="720" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- 左上角光晕 -->
  <ellipse cx="200" cy="100" rx="300" ry="200" fill="#48CAE4" opacity="0.05" filter="url(#softGlow)"/>

  <!-- 右下角光晕 -->
  <ellipse cx="1100" cy="600" rx="250" ry="180" fill="#0077B6" opacity="0.06" filter="url(#softGlow)"/>

  <!-- ===== 左侧内容区 ===== -->

  <!-- 问候语 -->
  <text x="80" y="140" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="18" fill="#90E0EF" letter-spacing="3" opacity="0.9">
    <tspan>尊敬的各位评委、老师，大家好</tspan>
  </text>

  <!-- 分割小横线 -->
  <rect x="80" y="160" width="40" height="3" fill="#48CAE4" rx="1.5"/>

  <!-- 引入问题 -->
  <text x="80" y="210" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="22" fill="#CAF0F8" letter-spacing="3" opacity="0.85">
    <tspan>一家守护出行安全的企业，盈利质量究竟如何？</tspan>
  </text>

  <!-- 主标题 -->
  <text x="80" y="320" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="56" fill="url(#titleGrad)" font-weight="bold" letter-spacing="6">
    <tspan>锐明技术</tspan>
  </text>

  <!-- 主题装饰图标 - 盾牌 -->
  <use href="#tabler-filled-shield-check.svg" x="80" y="350" width="36" height="36" fill="#48CAE4" opacity="0.6"/>

  <!-- 副标题 -->
  <text x="80" y="430" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="28" fill="#90E0EF" letter-spacing="5" font-weight="300">
    <tspan>盈利质量分析</tspan>
  </text>

  <!-- 副标题英文 -->
  <text x="80" y="470" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="14" fill="#48CAE4" letter-spacing="4" opacity="0.5" font-weight="300">
    <tspan>Profit Quality Analysis</tspan>
  </text>

  <!-- 从四个维度看利润的"含金量" -->
  <text x="80" y="530" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="18" fill="#CAF0F8" letter-spacing="4" opacity="0.8">
    <tspan>从四个维度看利润的"含金量"</tspan>
  </text>

  <!-- 四个维度标签 -->
  <rect x="80" y="565" width="90" height="28" rx="14" fill="none" stroke="#48CAE4" stroke-width="1" opacity="0.5"/>
  <text x="125" y="584" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#48CAE4" text-anchor="middle" letter-spacing="2" opacity="0.7">
    <tspan>盈利能力</tspan>
  </text>

  <rect x="185" y="565" width="90" height="28" rx="14" fill="none" stroke="#48CAE4" stroke-width="1" opacity="0.5"/>
  <text x="230" y="584" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#48CAE4" text-anchor="middle" letter-spacing="2" opacity="0.7">
    <tspan>现金流</tspan>
  </text>

  <rect x="290" y="565" width="90" height="28" rx="14" fill="none" stroke="#48CAE4" stroke-width="1" opacity="0.5"/>
  <text x="335" y="584" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#48CAE4" text-anchor="middle" letter-spacing="2" opacity="0.7">
    <tspan>资产质量</tspan>
  </text>

  <rect x="395" y="565" width="90" height="28" rx="14" fill="none" stroke="#48CAE4" stroke-width="1" opacity="0.5"/>
  <text x="440" y="584" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="12" fill="#48CAE4" text-anchor="middle" letter-spacing="2" opacity="0.7">
    <tspan>成长性</tspan>
  </text>

  <!-- 分隔竖线 -->
  <line x1="520" y1="80" x2="520" y2="640" stroke="#48CAE4" stroke-width="0.5" opacity="0.15"/>

  <!-- ===== 右侧视觉区 ===== -->

  <!-- 右侧大号数字装饰 -->
  <text x="1180" y="200" font-family="'Arial',sans-serif" font-size="180" fill="#48CAE4" opacity="0.04" font-weight="bold" text-anchor="end">
    <tspan>RQ</tspan>
  </text>
  <text x="1180" y="310" font-family="'Arial',sans-serif" font-size="60" fill="#00B4D8" opacity="0.06" font-weight="bold" text-anchor="end" letter-spacing="8">
    <tspan>ANALYSIS</tspan>
  </text>

  <!-- 右侧图标装饰 - 盾牌大图标 -->
  <g transform="translate(850, 200)" opacity="0.12">
    <use href="#tabler-filled-shield-check.svg" x="0" y="0" width="120" height="120" fill="#48CAE4"/>
  </g>

  <!-- 右侧环形装饰 -->
  <circle cx="920" cy="260" r="100" fill="none" stroke="#48CAE4" stroke-width="1" opacity="0.08"/>
  <circle cx="920" cy="260" r="80" fill="none" stroke="#48CAE4" stroke-width="0.5" opacity="0.06"/>
  <circle cx="920" cy="260" r="120" fill="none" stroke="#48CAE4" stroke-width="0.5" opacity="0.05"/>

  <!-- 右侧小装饰点 -->
  <circle cx="750" cy="180" r="3" fill="#48CAE4" opacity="0.15"/>
  <circle cx="820" cy="150" r="2" fill="#48CAE4" opacity="0.1"/>
  <circle cx="1050" cy="380" r="3" fill="#48CAE4" opacity="0.12"/>
  <circle cx="980" cy="420" r="2" fill="#48CAE4" opacity="0.08"/>

  <!-- 趋势线装饰（右侧） -->
  <polyline points="750,480 850,460 920,470 1000,440 1080,450" fill="none" stroke="#48CAE4" stroke-width="1.5" opacity="0.1"/>

  <!-- 底部信息栏 -->
  <rect x="0" y="680" width="1280" height="40" fill="#0A1329" opacity="0.5"/>
  
  <!-- 底部装饰线 -->
  <rect x="80" y="680" width="50" height="3" rx="1.5" fill="#48CAE4"/>

  <!-- 演讲者/小组信息 -->
  <text x="80" y="705" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="14" fill="#90E0EF" letter-spacing="3" opacity="0.6">
    <tspan>数据分析小组 · 财务分析报告</tspan>
  </text>

  <text x="1180" y="705" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="12" fill="#48CAE4" letter-spacing="2" text-anchor="end" opacity="0.4">
    <tspan>P01</tspan>
  </text>

  <!-- 页码底部小横线 -->
  <rect x="1200" y="700" width="20" height="1" fill="#48CAE4" opacity="0.2"/>
</svg>