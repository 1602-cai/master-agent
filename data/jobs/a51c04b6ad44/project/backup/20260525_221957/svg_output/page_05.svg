<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A2F"/>
      <stop offset="100%" stop-color="#0D2137"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2D44"/>
      <stop offset="100%" stop-color="#152638"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="okGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="warningGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowDeep">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- 装饰性背景网格 -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1280" y2="720" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="1280" y2="360" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="640" y2="720" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>

  <!-- 顶部装饰线 -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentGrad)"/>

  <!-- 页面标题区域 -->
  <rect x="40" y="30" width="1200" height="80" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.8"/>
  <rect x="40" y="30" width="6" height="80" rx="3" fill="url(#accentGrad)"/>

  <text x="70" y="78" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="2">📊 总结与结论</text>
  <text x="70" y="102" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#90E0EF" opacity="0.7">Summary &amp; Conclusion</text>

  <!-- 页码 -->
  <rect x="1210" y="55" width="30" height="30" rx="15" fill="#48CAE4" opacity="0.15"/>
  <text x="1225" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#48CAE4" text-anchor="middle">5</text>

  <!-- ========== 核心结论区域 — 大标题 ========== -->
  <rect x="40" y="135" width="1200" height="195" rx="16" fill="url(#cardGrad)" filter="url(#shadowDeep)" opacity="0.9"/>
  <rect x="40" y="135" width="1200" height="195" rx="16" fill="none" stroke="#48CAE4" stroke-width="1" opacity="0.15"/>

  <!-- 左上角装饰图标 -->
  <use href="#warning-icon" x="60" y="155" width="32" height="32" fill="#E74C3C" opacity="0.9"/>

  <text x="110" y="180" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="1">核心结论</text>
  <text x="110" y="205" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#90E0EF" opacity="0.6">Core Conclusion</text>

  <!-- 分隔线 -->
  <line x1="60" y1="218" x2="1180" y2="218" stroke="#48CAE4" stroke-width="1" opacity="0.2"/>

  <!-- 公司名称 + 结论 -->
  <text x="60" y="260" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="3">
    <tspan fill="#FFFFFF">锐明技术</tspan>
    <tspan fill="#48CAE4" font-size="36"> — </tspan>
    <tspan fill="#E74C3C" font-size="32" font-weight="700">"表面风光，暗藏风险"</tspan>
  </text>

  <!-- 右侧综合评级标签 -->
  <rect x="920" y="230" width="220" height="80" rx="40" fill="url(#dangerGrad)" filter="url(#glow)" opacity="0.85"/>
  <text x="1030" y="266" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.7" text-anchor="middle" letter-spacing="2">综合评级</text>
  <text x="1030" y="298" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">⚠ 警惕</text>

  <!-- ========== 四维度评分卡 ========== -->
  <!-- 小标题 -->
  <text x="60" y="365" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1">四维度综合评分</text>
  <text x="60" y="385" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#90E0EF" opacity="0.5">4-Dimension Scoring</text>

  <!-- 维度1: 现金保障性 -->
  <rect x="40" y="405" width="280" height="130" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.85"/>
  <rect x="40" y="405" width="280" height="130" rx="14" fill="none" stroke="#E74C3C" stroke-width="1.5" opacity="0.3"/>
  <circle cx="75" cy="440" r="18" fill="#E74C3C" opacity="0.2"/>
  <text x="75" y="446" font-family="Arial, sans-serif" font-size="18" fill="#E74C3C" text-anchor="middle" font-weight="700">✕</text>
  <text x="105" y="446" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">现金保障性</text>
  <text x="105" y="466" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#90E0EF" opacity="0.5">Cash Security</text>
  <line x1="60" y1="482" x2="300" y2="482" stroke="#E74C3C" stroke-width="1" opacity="0.15"/>
  <rect x="60" y="498" width="240" height="8" rx="4" fill="#1A2D44"/>
  <rect x="60" y="498" width="60" height="8" rx="4" fill="#E74C3C" opacity="0.8"/>
  <text x="280" y="520" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" text-anchor="end" font-weight="600">1.2 / 10</text>

  <!-- 维度2: 持续性 -->
  <rect x="340" y="405" width="280" height="130" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.85"/>
  <rect x="340" y="405" width="280" height="130" rx="14" fill="none" stroke="#E74C3C" stroke-width="1.5" opacity="0.3"/>
  <circle cx="375" cy="440" r="18" fill="#E74C3C" opacity="0.2"/>
  <text x="375" y="446" font-family="Arial, sans-serif" font-size="18" fill="#E74C3C" text-anchor="middle" font-weight="700">✕</text>
  <text x="405" y="446" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">持续性</text>
  <text x="405" y="466" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#90E0EF" opacity="0.5">Sustainability</text>
  <line x1="360" y1="482" x2="600" y2="482" stroke="#E74C3C" stroke-width="1" opacity="0.15"/>
  <rect x="360" y="498" width="240" height="8" rx="4" fill="#1A2D44"/>
  <rect x="360" y="498" width="72" height="8" rx="4" fill="#E74C3C" opacity="0.8"/>
  <text x="580" y="520" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" text-anchor="end" font-weight="600">1.7 / 10</text>

  <!-- 维度3: 成长性 -->
  <rect x="640" y="405" width="280" height="130" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.85"/>
  <rect x="640" y="405" width="280" height="130" rx="14" fill="none" stroke="#2ECC71" stroke-width="1.5" opacity="0.3"/>
  <circle cx="675" cy="440" r="18" fill="#2ECC71" opacity="0.2"/>
  <text x="675" y="446" font-family="Arial, sans-serif" font-size="18" fill="#2ECC71" text-anchor="middle" font-weight="700">✓</text>
  <text x="705" y="446" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">成长性</text>
  <text x="705" y="466" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#90E0EF" opacity="0.5">Growth</text>
  <line x1="660" y1="482" x2="900" y2="482" stroke="#2ECC71" stroke-width="1" opacity="0.15"/>
  <rect x="660" y="498" width="240" height="8" rx="4" fill="#1A2D44"/>
  <rect x="660" y="498" width="168" height="8" rx="4" fill="#2ECC71" opacity="0.8"/>
  <text x="880" y="520" font-family="Arial, sans-serif" font-size="13" fill="#2ECC71" text-anchor="end" font-weight="600">6.5 / 10</text>

  <!-- 维度4: 安全性 -->
  <rect x="940" y="405" width="300" height="130" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.85"/>
  <rect x="940" y="405" width="300" height="130" rx="14" fill="none" stroke="#E74C3C" stroke-width="1.5" opacity="0.3"/>
  <circle cx="975" cy="440" r="18" fill="#E74C3C" opacity="0.2"/>
  <text x="975" y="446" font-family="Arial, sans-serif" font-size="18" fill="#E74C3C" text-anchor="middle" font-weight="700">✕</text>
  <text x="1005" y="446" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">安全性</text>
  <text x="1005" y="466" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#90E0EF" opacity="0.5">Safety</text>
  <line x1="960" y1="482" x2="1220" y2="482" stroke="#E74C3C" stroke-width="1" opacity="0.15"/>
  <rect x="960" y="498" width="260" height="8" rx="4" fill="#1A2D44"/>
  <rect x="960" y="498" width="78" height="8" rx="4" fill="#E74C3C" opacity="0.8"/>
  <text x="1200" y="520" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" text-anchor="end" font-weight="600">1.8 / 10</text>

  <!-- ========== 底部三个关键警示卡片 ========== -->
  <text x="60" y="575" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1">关键警示</text>
  <text x="60" y="595" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#90E0EF" opacity="0.5">Key Alerts</text>

  <!-- 警示1: 营收增长 — 绿色/正向 -->
  <rect x="40" y="610" width="380" height="85" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.85"/>
  <rect x="40" y="610" width="6" height="85" rx="3" fill="#2ECC71"/>
  <circle cx="78" cy="646" r="18" fill="#2ECC71" opacity="0.15"/>
  <use href="#trend-icon" x="65" y="633" width="26" height="26" fill="#2ECC71"/>
  <text x="115" y="642" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="700" fill="#2ECC71">✅ 营收增长</text>
  <text x="115" y="665" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#90E0EF" opacity="0.7">营业收入保持增长趋势，规模持续扩大</text>

  <!-- 警示2: 现金流吃紧 — 红色/危险 -->
  <rect x="450" y="610" width="380" height="85" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.85"/>
  <rect x="450" y="610" width="6" height="85" rx="3" fill="#E74C3C"/>
  <circle cx="488" cy="646" r="18" fill="#E74C3C" opacity="0.15"/>
  <use href="#cash-icon" x="475" y="633" width="26" height="26" fill="#E74C3C"/>
  <text x="525" y="642" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="700" fill="#E74C3C">❌ 现金流吃紧</text>
  <text x="525" y="665" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#90E0EF" opacity="0.7">经营现金流净额持续为负，造血能力堪忧</text>

  <!-- 警示3: 利润虚高 — 红色/危险 -->
  <rect x="860" y="610" width="380" height="85" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.85"/>
  <rect x="860" y="610" width="6" height="85" rx="3" fill="#E74C3C"/>
  <circle cx="898" cy="646" r="18" fill="#E74C3C" opacity="0.15"/>
  <use href="#warning-s-icon" x="885" y="633" width="26" height="26" fill="#E74C3C"/>
  <text x="935" y="642" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="700" fill="#E74C3C">❌ 利润虚高</text>
  <text x="935" y="665" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#90E0EF" opacity="0.7">净利润与现金流严重背离，盈利质量存疑</text>

  <!-- 底部副装饰线 -->
  <rect x="0" y="716" width="1280" height="4" fill="url(#accentGrad)" opacity="0.5"/>

</svg>