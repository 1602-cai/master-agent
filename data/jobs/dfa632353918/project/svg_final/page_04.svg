  <text x="128" y="238" font-family="'Montserrat SemiBold','Microsoft YaHei',sans-serif" font-size="20" fill="#FFFFFF" font-weight="600">应收账款压力增大</text>
  <text fill="rgba(255,255,255,0.75)" font-size="15" font-family="'Calibri','Microsoft YaHei',sans-serif" x="88" y="272">应收账款周转天数同比上升15%，</text><text fill="rgba(255,255,255,0.75)" font-size="15" font-family="'Calibri','Microsoft YaHei',sans-serif" x="88" y="296">回款周期延长，资金占用加剧。</text><path fill="rgba(255,255,255,0.06)" d="M68,340 H572 A8,8 0 0 1 580,348 V452 A8,8 0 0 1 572,460 H68 A8,8 0 0 1 60,452 V348 A8,8 0 0 1 68,340 Z" />
