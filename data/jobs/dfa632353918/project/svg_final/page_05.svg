  <text x="908" y="496" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">多元化融资渠道分散风险</text>
  
  <circle cx="896" cy="518" r="4" fill="#E67E22" />
