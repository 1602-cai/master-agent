  <text x="122" y="228" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">公司整体盈利质量处于</text>
  <text x="122" y="256" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">
    <tspan fill="#E67E22" font-weight="bold">"中等偏上"</tspan>水平。
    <tspan fill="#666666" font-weight="normal">主营业务造血能力稳健，毛利率连续三年维持在40%以上；但应收账款周转天数延长至72天，</tspan>
  </text>
  <text x="122" y="274" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#666666">经营性现金流波动较大，需关注回款效率与成本管控的平衡。</text>

  
