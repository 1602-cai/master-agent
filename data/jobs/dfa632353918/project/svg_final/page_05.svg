  <circle cx="496" cy="490" r="4" fill="#003366" />
  <text x="508" y="496" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">优化供应链降低采购成本</text>
  
  <circle cx="496" cy="518" r="4" fill="#003366" />
  <text x="508" y="524" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">费用支出同比压降5%-8%</text>
  
  <circle cx="496" cy="546" r="4" fill="#003366" />
  <text x="508" y="552" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">每季度开展成本审计复盘</text>

  
