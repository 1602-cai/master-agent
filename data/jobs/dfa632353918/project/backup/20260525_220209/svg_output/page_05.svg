<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#1A4F7A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#003366" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow2" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#003366" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#003366" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F5F5F5"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentGrad)"/>

  <!-- Header Band -->
  <rect x="0" y="0" width="1280" height="120" fill="url(#headerGrad)"/>
  
  <!-- Header decorative element - subtle diagonal -->
  <polygon points="0,120 300,0 0,0" fill="#E67E22" opacity="0.08"/>
  <polygon points="1280,120 980,0 1280,0" fill="#E67E22" opacity="0.05"/>

  <!-- Page number indicator -->
  <rect x="40" y="28" width="36" height="36" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="58" y="52" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" opacity="0.8">05</text>

  <!-- Title -->
  <text x="100" y="68" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#E67E22" letter-spacing="4" text-transform="uppercase">SUMMARY &amp; ACTION</text>
  <text x="100" y="100" font-family="Montserrat Bold, Microsoft YaHei, Arial, sans-serif" font-size="32" fill="#FFFFFF" letter-spacing="1">总结与行动建议</text>

  <!-- Decorative line under title -->
  <rect x="100" y="112" width="50" height="3" rx="1.5" fill="#E67E22"/>

  <!-- Icon decorative right -->
  <use href="#icon-clipboard-check" x="1200" y="36" width="48" height="48" fill="#FFFFFF" opacity="0.12"/>

  <!-- ==================== MAIN CONTENT ==================== -->

  <!-- SECTION 1: Core Conclusion highlighted card -->
  <rect x="60" y="150" width="1160" height="130" rx="12" fill="#FFFFFF" filter="url(#shadow1)"/>
  
  <!-- Left accent bar -->
  <rect x="60" y="150" width="6" height="130" rx="3" fill="#E67E22"/>
  
  <!-- Section label -->
  <rect x="86" y="168" width="100" height="24" rx="12" fill="#E67E22" opacity="0.12"/>
  <text x="136" y="184" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#E67E22" text-anchor="middle">核心结论</text>
  
  <use href="#icon-clipboard-check" x="90" y="210" width="22" height="22" fill="#E67E22"/>
  
  <text x="122" y="228" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">公司整体盈利质量处于</text>
  <text x="122" y="256" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">
    <tspan fill="#E67E22" font-weight="bold">"中等偏上"</tspan>水平。
    <tspan fill="#666666" font-weight="normal">主营业务造血能力稳健，毛利率连续三年维持在40%以上；但应收账款周转天数延长至72天，</tspan>
  </text>
  <text x="122" y="274" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#666666">经营性现金流波动较大，需关注回款效率与成本管控的平衡。</text>

  <!-- Divider line -->
  <rect x="60" y="300" width="1160" height="1" fill="#EEEEEE"/>

  <!-- SECTION 2: Key Actions - Three column cards -->
  <text x="60" y="340" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#003366" letter-spacing="3">关键行动建议</text>
  <rect x="60" y="350" width="40" height="3" rx="1.5" fill="#E67E22"/>

  <!-- Action Card 1 -->
  <rect x="60" y="375" width="360" height="200" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
  <rect x="60" y="375" width="360" height="6" rx="3" fill="#003366"/>
  
  <!-- Number circle -->
  <circle cx="100" cy="410" r="18" fill="#003366"/>
  <text x="100" y="416" font-family="Montserrat Bold, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">1</text>
  
  <text x="130" y="417" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#003366">优化应收账款管理</text>
  
  <rect x="90" y="438" width="300" height="1" fill="#EEEEEE"/>
  
  <circle cx="96" cy="462" r="4" fill="#E67E22"/>
  <text x="108" y="468" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">建立客户信用分级评估体系</text>
  
  <circle cx="96" cy="490" r="4" fill="#E67E22"/>
  <text x="108" y="496" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">缩短账期至45天以内</text>
  
  <circle cx="96" cy="518" r="4" fill="#E67E22"/>
  <text x="108" y="524" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">引入应收账款保理机制</text>
  
  <circle cx="96" cy="546" r="4" fill="#E67E22"/>
  <text x="108" y="552" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">设置回款预警与催收自动化</text>

  <!-- Action Card 2 -->
  <rect x="460" y="375" width="360" height="200" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
  <rect x="460" y="375" width="360" height="6" rx="3" fill="#E67E22"/>
  
  <circle cx="500" cy="410" r="18" fill="#E67E22"/>
  <text x="500" y="416" font-family="Montserrat Bold, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">2</text>
  
  <text x="530" y="417" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#E67E22">加强成本费用管控</text>
  
  <rect x="490" y="438" width="300" height="1" fill="#EEEEEE"/>
  
  <circle cx="496" cy="462" r="4" fill="#003366"/>
  <text x="508" y="468" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">推行全面预算管理制度</text>
  
  <circle cx="496" cy="490" r="4" fill="#003366"/>
  <text x="508" y="496" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">优化供应链降低采购成本</text>
  
  <circle cx="496" cy="518" r="4" fill="#003366"/>
  <text x="508" y="524" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">费用支出同比压降5%-8%</text>
  
  <circle cx="496" cy="546" r="4" fill="#003366"/>
  <text x="508" y="552" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">每季度开展成本审计复盘</text>

  <!-- Action Card 3 -->
  <rect x="860" y="375" width="360" height="200" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
  <rect x="860" y="375" width="360" height="6" rx="3" fill="#003366"/>
  
  <circle cx="900" cy="410" r="18" fill="#003366"/>
  <text x="900" y="416" font-family="Montserrat Bold, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">3</text>
  
  <text x="930" y="417" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#003366">强化现金流稳定性</text>
  
  <rect x="890" y="438" width="300" height="1" fill="#EEEEEE"/>
  
  <circle cx="896" cy="462" r="4" fill="#E67E22"/>
  <text x="908" y="468" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">建立6个月现金流储备</text>
  
  <circle cx="896" cy="490" r="4" fill="#E67E22"/>
  <text x="908" y="496" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">多元化融资渠道分散风险</text>
  
  <circle cx="896" cy="518" r="4" fill="#E67E22"/>
  <text x="908" y="524" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">优化现金转换周期（CCC）</text>
  
  <circle cx="896" cy="546" r="4" fill="#E67E22"/>
  <text x="908" y="552" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">定期进行现金流压力测试</text>

  <!-- SECTION 3: Bottom bar - Next Steps -->
  <rect x="60" y="600" width="1160" height="90" rx="12" fill="#003366" filter="url(#shadow2)"/>
  
  <use href="#icon-rocket" x="90" y="624" width="28" height="28" fill="#E67E22"/>
  
  <text x="130" y="639" font-family="Montserrat SemiBold, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">下一步工作重点</text>
  <text x="130" y="662" font-family="Calibri, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.8">
    <tspan>① 月度跟踪应收账款回收率</tspan>
    <tspan dx="30">② 季度费用审计与成本对标</tspan>
    <tspan dx="30">③ 半年度现金流压力测试报告</tspan>
    <tspan dx="30">④ 年度盈利质量全面复盘</tspan>
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="714" width="1280" height="6" fill="url(#accentGrad)"/>
</svg>