<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- 主背景渐变 - 深蓝到更深蓝 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001a33"/>
      <stop offset="50%" stop-color="#002952"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    
    <!-- 右侧光晕渐变 -->
    <radialGradient id="glowRight" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#003366" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#001a33" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 装饰线条渐变 -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E67E22" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#E67E22" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E67E22" stop-opacity="0"/>
    </linearGradient>
    
    <!-- 金色装饰光晕 -->
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E67E22" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 网格图案 -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    
    <!-- 装饰圆点渐变 -->
    <radialGradient id="dotGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 底边装饰渐变 -->
    <linearGradient id="bottomBarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0"/>
      <stop offset="15%" stop-color="#E67E22" stop-opacity="1"/>
      <stop offset="85%" stop-color="#E67E22" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E67E22" stop-opacity="0"/>
    </linearGradient>
    
    <!-- 左上装饰角标渐变 -->
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E67E22" stop-opacity="0"/>
    </linearGradient>

    <!-- 向下箭头图标 -->
    <g id="icon-arrow-down">
      <path d="M12 5v14M5 12l7 7 7-7" stroke="#E67E22" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ========== 背景层 ========== -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- 网格纹理 -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#grid)"/>
  
  <!-- 右侧光晕 -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#glowRight)"/>
  
  <!-- 中心金色光晕 -->
  <ellipse cx="640" cy="360" rx="420" ry="320" fill="url(#goldGlow)"/>

  <!-- ========== 抽象几何装饰（代表金融/数据分析概念） ========== -->
  
  <!-- 右上角 - 抽象上升趋势线条 -->
  <g transform="translate(980, 120)" opacity="0.15">
    <polyline points="0,80 20,65 45,70 70,40 100,50 130,20 160,25 190,5" 
              fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <polyline points="0,80 20,72 45,75 70,55 100,60 130,35 160,40 190,15" 
              fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- 右上角 - 柱状图抽象 -->
  <g transform="translate(1020, 150)" opacity="0.1">
    <rect x="0" y="40" width="12" height="20" rx="2" fill="#FFFFFF"/>
    <rect x="18" y="25" width="12" height="35" rx="2" fill="#FFFFFF"/>
    <rect x="36" y="10" width="12" height="50" rx="2" fill="#FFFFFF"/>
    <rect x="54" y="30" width="12" height="30" rx="2" fill="#FFFFFF"/>
  </g>
  
  <!-- 左上角 - 散点图抽象 -->
  <g transform="translate(80, 100)" opacity="0.08">
    <circle cx="20" cy="30" r="3" fill="#FFFFFF"/>
    <circle cx="50" cy="15" r="3" fill="#FFFFFF"/>
    <circle cx="80" cy="40" r="3" fill="#FFFFFF"/>
    <circle cx="110" cy="10" r="3" fill="#FFFFFF"/>
    <circle cx="140" cy="25" r="3" fill="#FFFFFF"/>
    <circle cx="35" cy="50" r="3" fill="#FFFFFF"/>
    <circle cx="95" cy="55" r="3" fill="#FFFFFF"/>
    <circle cx="125" cy="45" r="3" fill="#FFFFFF"/>
  </g>
  
  <!-- 左下角 - 网格线装饰 -->
  <g transform="translate(60, 520)" opacity="0.06">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="20" x2="200" y2="20" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="40" x2="200" y2="40" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="60" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="60" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="60" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="60" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="60" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  
  <!-- 右下角 - 折线抽象 -->
  <g transform="translate(1020, 530)" opacity="0.08">
    <polyline points="0,50 20,45 40,48 60,30 80,35 100,15 120,20 140,10 160,18 180,5" 
              fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="60" cy="30" r="3" fill="#FFFFFF"/>
    <circle cx="100" cy="15" r="3" fill="#FFFFFF"/>
    <circle cx="140" cy="10" r="3" fill="#FFFFFF"/>
    <circle cx="180" cy="5" r="3" fill="#FFFFFF"/>
  </g>

  <!-- ========== 装饰圆点 ========== -->
  <circle cx="200" cy="180" r="4" fill="url(#dotGrad)"/>
  <circle cx="1100" cy="200" r="6" fill="url(#dotGrad)"/>
  <circle cx="150" cy="450" r="3" fill="url(#dotGrad)"/>
  <circle cx="1050" cy="500" r="5" fill="url(#dotGrad)"/>

  <!-- ========== 主标题内容区 ========== -->
  
  <!-- 上方装饰线 -->
  <rect x="440" y="215" width="400" height="1" fill="url(#lineGrad)"/>
  
  <!-- 公司名称 - 层级1 -->
  <text x="640" y="278" text-anchor="middle" 
        font-family="'Montserrat','Microsoft YaHei','SimHei',sans-serif" 
        font-weight="300" font-size="28" fill="#FFFFFF" fill-opacity="0.5" 
        letter-spacing="12">
    锐明技术
  </text>
  
  <!-- 主标题 - 大号加粗 -->
  <text x="640" y="358" text-anchor="middle" 
        font-family="'Montserrat','Microsoft YaHei','SimHei',sans-serif" 
        font-weight="700" font-size="64" fill="#FFFFFF" 
        letter-spacing="6">
    盈利质量分析报告
  </text>
  
  <!-- 主题色装饰块 - 位于标题下方 -->
  <rect x="590" y="385" width="100" height="4" rx="2" fill="#E67E22"/>
  
  <!-- 副标题 / 说明 -->
  <text x="640" y="430" text-anchor="middle" 
        font-family="'Montserrat','Microsoft YaHei','SimHei',sans-serif" 
        font-weight="400" font-size="18" fill="#FFFFFF" fill-opacity="0.6" 
        letter-spacing="4">
    —— 基于2023-2024年度财务数据深度分析 ——
  </text>
  
  <!-- 下方装饰线 -->
  <rect x="440" y="460" width="400" height="1" fill="url(#lineGrad)"/>

  <!-- ========== 底部信息区 ========== -->
  
  <!-- 底部分隔线 -->
  <rect x="0" y="640" width="1280" height="2" fill="url(#bottomBarGrad)"/>
  
  <!-- 底部左侧：报告编号 / 分类 -->
  <text x="80" y="672" text-anchor="start" 
        font-family="'Calibri','Microsoft YaHei','SimHei',sans-serif" 
        font-weight="400" font-size="13" fill="#FFFFFF" fill-opacity="0.35" 
        letter-spacing="2">
    分类编号 · FIN-2024-R001
  </text>
  
  <!-- 底部右侧：日期 -->
  <text x="1200" y="672" text-anchor="end" 
        font-family="'Calibri','Microsoft YaHei','SimHei',sans-serif" 
        font-weight="400" font-size="13" fill="#FFFFFF" fill-opacity="0.35" 
        letter-spacing="2">
    2024年度
  </text>

  <!-- ========== 装饰性角落元素 ========== -->
  
  <!-- 左上角装饰 -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="3" height="40" fill="#E67E22" opacity="0.6"/>
    <rect x="0" y="0" width="40" height="3" fill="#E67E22" opacity="0.6"/>
    <rect x="8" y="8" width="2" height="24" fill="#E67E22" opacity="0.3"/>
    <rect x="8" y="8" width="24" height="2" fill="#E67E22" opacity="0.3"/>
  </g>
  
  <!-- 右下角装饰 -->
  <g transform="translate(1240, 650)">
    <rect x="0" y="0" width="3" height="40" fill="#E67E22" opacity="0.4" transform="rotate(180, 1.5, 20)"/>
    <rect x="0" y="0" width="40" height="3" fill="#E67E22" opacity="0.4" transform="rotate(180, 20, 1.5)"/>
  </g>

  <!-- ========== 中央装饰图标 ========== -->
  <g transform="translate(640, 520)" opacity="0.15">
    <use href="#icon-arrow-down" width="24" height="24" x="-12" y="-12"/>
  </g>

</svg>